<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项管理系统</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info span {
            font-size: 16px;
        }

        .project-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .project-tab {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .project-tab:hover {
            background: rgba(255,255,255,0.3);
        }

        .project-tab.active {
            background: white;
            color: #667eea;
        }

        .project-tab .delete-project {
            margin-left: 8px;
            color: #ff6b6b;
            font-weight: bold;
        }

        .add-project-btn {
            background: rgba(255,255,255,0.3);
            border: 2px dashed rgba(255,255,255,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .add-project-btn:hover {
            background: rgba(255,255,255,0.4);
            border-color: white;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 14px;
        }

        .warning-banner {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px 30px;
            display: none;
        }

        .warning-banner.show {
            display: block;
        }

        .warning-banner h3 {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .warning-count {
            background: #dc3545;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 14px;
        }

        /* 汇总统计样式 */
        .summary-banner {
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 10px 30px;
        }

        .summary-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .summary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .summary-btn.active {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .summary-container {
            padding: 25px 30px;
            background: white;
            border-bottom: 1px solid #dee2e6;
        }

        .summary-header {
            margin-bottom: 20px;
        }

        .summary-header h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .summary-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .summary-total {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            min-width: 120px;
        }

        .summary-total .summary-label {
            font-size: 12px;
            opacity: 0.9;
            display: block;
        }

        .summary-total .summary-value {
            font-size: 24px;
            font-weight: bold;
            display: block;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #dee2e6;
        }

        .summary-card .dept-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .summary-card .progress-bar {
            height: 22px;
            background: #e9ecef;
            border-radius: 11px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .summary-card .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            transition: width 0.3s;
        }

        .summary-card .progress-text {
            font-size: 14px;
            color: #666;
        }

        .summary-projects {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #dee2e6;
        }

        .summary-projects h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .project-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }

        .project-stat .project-name {
            font-weight: 500;
            color: #333;
        }

        .project-stat .project-rate {
            font-weight: 600;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .batch-actions {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: #fff3cd;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .batch-actions.show {
            display: flex;
        }

        .batch-actions span {
            color: #856404;
            font-weight: 500;
        }

        .toolbar-left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box input, .search-box select {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            min-width: 140px;
        }

        .search-box input:focus, .search-box select:focus {
            outline: none;
            border-color: #667eea;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            table-layout: fixed;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            word-wrap: break-word;
        }

        th:nth-child(1), td:nth-child(1) {
            width: 40px;
            white-space: nowrap;
            text-align: center;
        }

        th:nth-child(2), td:nth-child(2) {
            width: 60px;
            white-space: nowrap;
            text-align: center;
        }

        th:nth-child(3), td:nth-child(3) {
            width: 100px;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th:nth-child(4), td:nth-child(4) {
            min-width: 300px;
            word-wrap: break-word;
        }

        th:nth-child(5), td:nth-child(5) {
            width: 80px;
            white-space: nowrap;
        }

        th:nth-child(6), td:nth-child(6) {
            width: 110px;
            white-space: nowrap;
        }

        th:nth-child(7), td:nth-child(7) {
            width: 110px;
            white-space: nowrap;
        }

        th:nth-child(8), td:nth-child(8) {
            width: 100px;
            white-space: nowrap;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-overdue {
            color: #dc3545;
            font-weight: bold;
        }

        .status-warning {
            color: #ffc107;
            font-weight: bold;
        }

        .status-completed {
            color: #28a745;
        }

        .status-early {
            color: #17a2b8;
            font-weight: bold;
        }

        .status-pending {
            color: #666;
        }

        .status-latecompleted {
            color: #ff8c00;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .readonly .actions {
            display: none;
        }

        .stats-container {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stats-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .stats-filter select {
            padding: 8px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .stats-filter select:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat-card .dept-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .stat-card .progress-bar {
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .stat-card .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            transition: width 0.3s;
        }

        .stat-card .progress-text {
            font-size: 14px;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .modal-header h2 {
            color: #333;
            font-size: 22px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-form .form-group {
            margin-bottom: 18px;
        }

        .modal-form label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }

        .modal-form input, .modal-form select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .modal-form input:focus, .modal-form select:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-form textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            min-height: 80px;
            resize: vertical;
        }

        .modal-form textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkbox-item input {
            width: auto;
        }

        .modal-footer {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .readonly-notice {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            color: #004085;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .data-tip {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            color: #004085;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .data-tip strong {
            display: block;
            margin-bottom: 8px;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: #667eea;
            font-size: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 10px;
            }

            .header {
                padding: 15px;
            }

            .header-top {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 20px;
            }

            .user-info {
                width: 100%;
                justify-content: space-between;
            }

            .project-tabs {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 10px;
                flex-wrap: nowrap;
                -webkit-overflow-scrolling: touch;
            }

            .project-tab {
                white-space: nowrap;
                padding: 8px 15px;
                font-size: 13px;
            }

            .add-project-btn {
                white-space: nowrap;
                padding: 8px 15px;
                font-size: 13px;
            }

            .content {
                padding: 15px;
            }

            .warning-banner {
                padding: 12px 15px;
            }

            .warning-banner h3 {
                font-size: 15px;
            }

            .data-tip {
                padding: 12px;
                font-size: 13px;
            }

            .toolbar {
                flex-direction: column;
                gap: 12px;
            }

            .toolbar-left, .toolbar-right {
                width: 100%;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .search-box input, .search-box select {
                width: 100%;
                padding: 10px 12px;
                font-size: 14px;
            }

            .search-box select {
                margin-top: 8px;
            }

            .btn {
                width: 100%;
                padding: 12px 15px;
                font-size: 15px;
                text-align: center;
            }

            .toolbar-right {
                gap: 8px;
            }

            .readonly-notice {
                font-size: 13px;
                padding: 10px 12px;
            }

            .table-container {
                font-size: 13px;
                margin: 0 -15px;
                padding: 0 15px;
            }

            table {
                min-width: 600px;
            }

            th, td {
                padding: 10px 8px;
                font-size: 13px;
            }

            th {
                font-size: 12px;
            }

            .actions {
                flex-direction: column;
                gap: 5px;
            }

            .actions .btn {
                width: auto;
                padding: 6px 10px;
                font-size: 12px;
            }

            .stats-container {
                padding: 15px;
                margin-top: 20px;
            }

            .stats-title {
                font-size: 16px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-card {
                padding: 12px 10px;
            }

            .stat-card .dept-name {
                font-size: 13px;
            }

            .stat-card .progress-text {
                font-size: 12px;
            }

            /* 移动端弹窗优化 */
            .modal {
                padding: 10px;
                align-items: flex-end;
            }

            .modal-content {
                width: 100%;
                max-width: 100%;
                max-height: 85vh;
                border-radius: 15px 15px 0 0;
                padding: 20px;
            }

            .modal-header {
                padding-bottom: 12px;
                margin-bottom: 20px;
            }

            .modal-header h2 {
                font-size: 18px;
            }

            .modal-form .form-group {
                margin-bottom: 15px;
            }

            .modal-form label {
                font-size: 14px;
                margin-bottom: 5px;
            }

            .modal-form input, 
            .modal-form select,
            .modal-form textarea {
                padding: 12px;
                font-size: 16px; /* 防止iOS缩放 */
            }

            .checkbox-group {
                gap: 10px;
            }

            .checkbox-item {
                min-width: 50%;
                padding: 5px 0;
            }

            .checkbox-item input {
                transform: scale(1.2);
            }

            .modal-footer {
                flex-direction: column;
                gap: 10px;
                margin-top: 20px;
            }

            .modal-footer .btn {
                width: 100%;
            }

            #loginModal .modal-content {
                max-height: 70vh;
            }

            #loginForm + p {
                font-size: 12px;
            }

            /* 加载动画优化 */
            .loading-text {
                font-size: 14px;
            }
        }

        /* 返回顶部按钮 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
            z-index: 1000;
        }

        .back-to-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .back-to-top.show {
            display: flex;
        }

        /* 极小屏幕优化 */
        @media (max-width: 400px) {
            .header h1 {
                font-size: 18px;
            }

            .project-tab,
            .add-project-btn {
                padding: 6px 12px;
                font-size: 12px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .back-to-top {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在连接服务器...</div>
    </div>

    <div class="container" id="mainPage">
        <div class="header">
            <div class="header-top">
                <h1>📋 待办事项管理</h1>
                <div class="user-info">
                    <span id="currentUser">👤 加载中...</span>
                    <button class="btn btn-secondary btn-sm" id="loginBtn" onclick="openLoginModal()">🔐 登录</button>
                    <button class="btn btn-secondary btn-sm" id="changePasswordBtn" style="display:none;" onclick="openChangePasswordModal()">🔑 改密</button>
                </div>
            </div>
            <div class="project-tabs" id="projectTabs">
            </div>
        </div>

        <div class="summary-banner" id="summaryBanner">
            <button class="summary-btn" id="summaryBtn" onclick="toggleSummaryView()">
                📊 汇总统计
            </button>
        </div>

        <div class="summary-container" id="summaryContainer" style="display: none;">
            <div class="summary-header">
                <h2>📊 各部门整体完成率（汇总所有项目）</h2>
                <div class="summary-stats">
                    <div class="summary-total">
                        <span class="summary-label">总事项</span>
                        <span class="summary-value" id="totalCount">0</span>
                    </div>
                    <div class="summary-total">
                        <span class="summary-label">已完成</span>
                        <span class="summary-value" id="completedCount">0</span>
                    </div>
                    <div class="summary-total">
                        <span class="summary-label">总体完成率</span>
                        <span class="summary-value" id="overallRate">0%</span>
                    </div>
                </div>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        const API_URL = '/api/data';
        const LOGIN_API = '/api/login';
        const SESSION_API = '/api/session';
        const LOGOUT_API = '/api/logout';
        
        let currentUser = null;
        let isAdmin = false;
        let sessionToken = null;
        let currentProjectId = null;
        let projects = [];
        let allTodos = {};
        let selectedIds = [];

        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        document.getElementById('todoForm').addEventListener('submit', handleSubmit);
        document.getElementById('projectForm').addEventListener('submit', handleProjectSubmit);

        // 从localStorage恢复会话
        function restoreSession() {
            const savedToken = localStorage.getItem('sessionToken');
            const savedUser = localStorage.getItem('currentUser');
            const savedIsAdmin = localStorage.getItem('isAdmin');
            
            if (savedToken && savedUser) {
                sessionToken = savedToken;
                currentUser = savedUser;
                isAdmin = savedIsAdmin === 'true';
                return true;
            }
            return false;
        }

        // 验证会话
        async function validateSession() {
            if (!sessionToken) {
                console.log('validateSession: 没有token');
                return false;
            }
            
            console.log('validateSession: 正在验证token:', sessionToken);
            
            try {
                const response = await fetch(SESSION_API, {
                    headers: { 'X-Session-Token': sessionToken }
                });
                const result = await response.json();
                
                console.log('validateSession: 服务器响应:', result);
                
                if (result.success) {
                    currentUser = result.username;
                    isAdmin = result.isAdmin;
                    localStorage.setItem('currentUser', currentUser);
                    localStorage.setItem('isAdmin', isAdmin);
                    console.log('validateSession: 会话验证成功', currentUser, isAdmin);
                    return true;
                }
            } catch (error) {
                console.error('会话验证失败:', error);
            }
            
            // 会话无效，清除存储
            console.log('validateSession: 会话无效，清除');
            clearSession();
            return false;
        }

        // 清除会话
        function clearSession() {
            sessionToken = null;
            currentUser = null;
            isAdmin = false;
            localStorage.removeItem('sessionToken');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('isAdmin');
        }

        function showLoginPage() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('backToTop').style.display = 'none';
            openLoginModal();
        }

        function showMainPage() {
            document.getElementById('mainPage').style.display = 'block';
        }

        async function loadData() {
            showLoading();
            try {
                // 尝试恢复会话
                if (restoreSession()) {
                    const valid = await validateSession();
                    if (!valid) {
                        showLoginPage();
                        hideLoading();
                        return;
                    }
                    updateUserUI();
                } else {
                    showLoginPage();
                    hideLoading();
                    return;
                }
                
                const response = await fetch(API_URL, {
                    headers: { 'X-Session-Token': sessionToken || '' }
                });
                
                if (response.status === 401) {
                    clearSession();
                    showLoginPage();
                    hideLoading();
                    return;
                }
                
                const data = await response.json();
                projects = data.projects || [];
                allTodos = data.allTodos || {};
                
                if (projects.length === 0) {
                    projects.push({
                        id: Date.now().toString(),
                        name: '默认项目',
                        createdAt: new Date().toISOString()
                    });
                    allTodos[projects[0].id] = [];
                    await saveData();
                }
                
                currentProjectId = projects[0].id;
                
                showMainPage();
                renderProjectTabs();
                renderTable();
                renderStats();
                checkWarnings();
            } catch (error) {
                console.error('加载数据失败:', error);
                alert('连接服务器失败，请确保服务器已启动！\n\n启动方法：\n1. 打开命令行\n2. 进入todo-app目录\n3. 运行: npm start');
            } finally {
                hideLoading();
            }
        }

        async function saveData() {
            try {
                const data = { projects, allTodos };
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Token': sessionToken
                    },
                    body: JSON.stringify(data)
                });
                if (response.status === 401 || response.status === 403) {
                    clearSession();
                    showLoginPage();
                    return;
                }
            } catch (error) {
                console.error('保存数据失败:', error);
                alert('保存数据失败');
            }
        }

        async function refreshData() {
            await loadData();
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function addProject(name) {
            const project = {
                id: Date.now().toString(),
                name: name,
                createdAt: new Date().toISOString()
            };
            projects.push(project);
            allTodos[project.id] = [];
            return project;
        }

        function editProjectName(projectId) {
            if (!isAdmin) {
                alert('只有管理员可以修改项目名称');
                return;
            }

            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            const newName = prompt('请输入新的项目名称：', project.name);
            if (newName && newName.trim() !== '') {
                project.name = escapeHtml(newName.trim());
                saveData().then(() => {
                    renderProjectTabs();
                });
            }
        }

        async function deleteProject(projectId) {
            if (!isAdmin) {
                alert('只有管理员可以删除项目');
                return;
            }
            
            if (projects.length <= 1) {
                alert('至少需要保留一个项目');
                return;
            }

            if (confirm('确定要删除这个项目吗？删除后无法恢复！')) {
                delete allTodos[projectId];
                projects = projects.filter(p => p.id !== projectId);
                
                if (currentProjectId === projectId) {
                    currentProjectId = projects[0].id;
                }
                
                await saveData();
                renderProjectTabs();
                renderTable();
                renderStats();
                checkWarnings();
            }
        }

        function selectProject(projectId) {
            currentProjectId = projectId;
            renderProjectTabs();
            renderTable();
            renderStats();
            checkWarnings();
        }

        function getCurrentTodos() {
            return allTodos[currentProjectId] || [];
        }

        function setCurrentTodos(todos) {
            allTodos[currentProjectId] = todos;
        }

        function renderProjectTabs() {
            const container = document.getElementById('projectTabs');
            container.innerHTML = '';

            projects.forEach(project => {
                const tab = document.createElement('button');
                tab.className = `project-tab ${project.id === currentProjectId ? 'active' : ''}`;
                tab.innerHTML = `
                    ${escapeHtml(project.name)}
                    ${isAdmin ? `<span class="delete-project" onclick="event.stopPropagation(); deleteProject('${project.id}')">×</span>` : ''}
                `;
                tab.onclick = () => selectProject(project.id);
                if (isAdmin) {
                    tab.ondblclick = (e) => {
                        e.stopPropagation();
                        editProjectName(project.id);
                    };
                }
                container.appendChild(tab);
            });

            if (isAdmin) {
                const addBtn = document.createElement('button');
                addBtn.className = 'add-project-btn';
                addBtn.innerHTML = '➕ 新建项目';
                addBtn.onclick = openProjectModal;
                container.appendChild(addBtn);
            }
        }

        function openProjectModal() {
            document.getElementById('projectModal').classList.add('show');
            document.getElementById('projectName').value = '';
            document.getElementById('projectName').focus();
        }

        function closeProjectModal() {
            document.getElementById('projectModal').classList.remove('show');
        }

        async function handleProjectSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('projectName').value.trim();
            
            if (!name) {
                alert('请输入项目名称');
                return;
            }

            const newProject = addProject(name);
            currentProjectId = newProject.id;
            await saveData();
            renderProjectTabs();
            renderTable();
            renderStats();
            closeProjectModal();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(LOGIN_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentUser = result.username;
                    isAdmin = result.isAdmin;
                    sessionToken = result.token;
                    
                    localStorage.setItem('sessionToken', sessionToken);
                    localStorage.setItem('currentUser', currentUser);
                    localStorage.setItem('isAdmin', isAdmin);
                    
                    updateUserUI();
                    closeLoginModal();
                    await loadData();
                } else {
                    alert(result.message || '登录失败');
                }
            } catch (error) {
                console.error('登录失败:', error);
                alert('登录失败，请检查网络连接');
            }
        }

        function updateUserUI() {
            const userSpan = document.getElementById('currentUser');
            const loginBtn = document.getElementById('loginBtn');
            
            if (currentUser) {
                userSpan.textContent = currentUser + ' ' + (isAdmin ? '(管理员)' : '(访客)');
                loginBtn.textContent = '退出';
                loginBtn.onclick = logout;
                document.getElementById('changePasswordBtn').style.display = 'inline-block';
                
                if (isAdmin) {
                    document.getElementById('adminControls').style.display = 'block';
                    document.getElementById('editControls').style.display = 'block';
                    document.getElementById('readonlyNotice').style.display = 'none';
                    document.getElementById('tableContainer').classList.remove('readonly');
                } else {
                    document.getElementById('adminControls').style.display = 'none';
                    document.getElementById('editControls').style.display = 'none';
                    document.getElementById('readonlyNotice').style.display = 'block';
                    document.getElementById('tableContainer').classList.add('readonly');
                }
            } else {
                userSpan.textContent = '未登录';
                loginBtn.textContent = '登录';
                loginBtn.onclick = openLoginModal;
                document.getElementById('changePasswordBtn').style.display = 'none';
                document.getElementById('adminControls').style.display = 'none';
                document.getElementById('editControls').style.display = 'none';
                document.getElementById('readonlyNotice').style.display = 'none';
                document.getElementById('tableContainer').classList.remove('readonly');
            }
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.add('show');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('username').focus();
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('show');
        }

        async function logout() {
            try {
                await fetch(LOGOUT_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Session-Token': sessionToken
                    }
                });
            } catch (error) {
                console.error('退出登录失败:', error);
            }
            
            clearSession();
            showLoginPage();
        }

        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        function renderTable() {
            const tbody = document.getElementById('todoBody');
            const searchText = document.getElementById('searchText').value.toLowerCase();
            const filterDept = document.getElementById('filterDept').value;
            const filterStatus = document.getElementById('filterStatus').value;
            const filterMonth = document.getElementById('filterMonth').value;

            let todos = getCurrentTodos();
            
            // 更新月份筛选选项
            updateFilterMonthOptions();

            let completedTodos = todos.filter(t => t.actualDate);
            let pendingTodos = todos.filter(t => !t.actualDate);

            // 按部门排序，部门内按计划完成时间从早到晚排序
            const deptOrder = { '工程': 0, '成本': 1, '设计': 2, '前期': 3, '营销': 4, '运营': 5 };
            
            pendingTodos.sort((a, b) => {
                // 首先按第一个部门排序
                const aFirstDept = a.departments[0] || '';
                const bFirstDept = b.departments[0] || '';
                const deptCompare = (deptOrder[aFirstDept] || 99) - (deptOrder[bFirstDept] || 99);
                if (deptCompare !== 0) return deptCompare;
                
                // 部门相同则按计划完成时间排序
                return new Date(a.planDate) - new Date(b.planDate);
            });

            completedTodos.sort((a, b) => {
                // 首先按第一个部门排序
                const aFirstDept = a.departments[0] || '';
                const bFirstDept = b.departments[0] || '';
                const deptCompare = (deptOrder[aFirstDept] || 99) - (deptOrder[bFirstDept] || 99);
                if (deptCompare !== 0) return deptCompare;
                
                // 部门相同则按计划完成时间排序
                return new Date(a.planDate) - new Date(b.planDate);
            });

            let sortedTodos = [...pendingTodos, ...completedTodos];

            let filteredTodos = sortedTodos.filter(todo => {
                if (searchText && !todo.item.toLowerCase().includes(searchText)) {
                    return false;
                }
                if (filterDept && !todo.departments.includes(filterDept)) {
                    return false;
                }
                if (filterMonth && todo.planDate && !todo.planDate.startsWith(filterMonth)) {
                    return false;
                }
                const selectedStatuses = Array.from(document.getElementById('filterStatus').selectedOptions).map(o => o.value);
                if (selectedStatuses.length > 0) {
                    const status = getTodoStatus(todo);
                    if (selectedStatuses.includes('pending') && (status === 'pending' || status === 'warning' || status === 'overdue')) {
                        // pass
                    } else if (!selectedStatuses.includes(status)) {
                        return false;
                    }
                }
                return true;
            });

            tbody.innerHTML = '';

        function getTodoStatus(todo) {
            if (todo.actualDate) {
                const planDate = new Date(todo.planDate);
                const actualDate = new Date(todo.actualDate);
                planDate.setHours(0, 0, 0, 0);
                actualDate.setHours(0, 0, 0, 0);
                
                if (actualDate < planDate) {
                    return 'early';
                } else if (actualDate > planDate) {
                    return 'latecompleted';
                }
                return 'completed';
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const planDate = new Date(todo.planDate);
            planDate.setHours(0, 0, 0, 0);

            const diffDays = Math.ceil((planDate - today) / (1000 * 60 * 60 * 24));

            if (diffDays < 0) {
                return 'overdue';
            } else if (diffDays <= 7) {
                return 'warning';
            }
            return 'pending';
        }

        function getStatusText(status) {
            switch(status) {
                case 'completed': return '✓ 按时完成';
                case 'early': return '🌟 提前完成';
                case 'latecompleted': return '⚠️ 逾期完成';
                case 'overdue': return '⚠️ 已逾期';
                case 'warning': return '⏰ 即将到期';
                default: return '○ 待处理';
            }
        }

        function getStatusClass(status) {
            switch(status) {
                case 'completed': return 'status-completed';
                case 'early': return 'status-early';
                case 'latecompleted': return 'status-latecompleted';
                case 'overdue': return 'status-overdue';
                case 'warning': return 'status-warning';
                default: return 'status-pending';
            }
        }

        function checkWarnings() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            let warningCount = 0;
            let overdueCount = 0;
            let warningItems = [];

            const todos = getCurrentTodos();

            todos.forEach(todo => {
                if (todo.actualDate) return;

                const planDate = new Date(todo.planDate);
                planDate.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((planDate - today) / (1000 * 60 * 60 * 24));

                if (diffDays < 0) {
                    overdueCount++;
                    warningItems.push(`• ${escapeHtml(todo.item)}（已逾期）`);
                } else if (diffDays <= 7) {
                    warningCount++;
                    warningItems.push(`• ${escapeHtml(todo.item)}（${diffDays === 0 ? '今天' : diffDays + '天后'}到期）`);
                }
            });

            const banner = document.getElementById('warningBanner');
            const countEl = document.getElementById('warningCount');
            const messageEl = document.getElementById('warningMessage');

            if (overdueCount > 0 || warningCount > 0) {
                banner.classList.add('show');
                countEl.textContent = overdueCount + warningCount;
                
                let messages = [];
                if (overdueCount > 0) {
                    messages.push(`<strong>已逾期 ${overdueCount} 项</strong>`);
                }
                if (warningCount > 0) {
                    messages.push(`<strong>即将到期 ${warningCount} 项</strong>`);
                }
                
                messageEl.innerHTML = messages.join('，') + '<br>' + warningItems.slice(0, 5).join('<br>');
                if (warningItems.length > 5) {
                    messageEl.innerHTML += '<br>...';
                }
            } else {
                banner.classList.remove('show');
            }
        }

        async function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!isAdmin) {
                alert('只有管理员可以导入数据');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                    if (jsonData.length < 2) {
                        alert('导入的文件没有数据');
                        return;
                    }

                    const headers = jsonData[0];
                    const headerMap = {};
                    headers.forEach((h, i) => {
                        headerMap[h] = i;
                    });

                    const newTodos = [];
                    let errorRows = [];

                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (!row || row.length === 0 || !row[headerMap['事项']]) continue;

                        const departmentsStr = row[headerMap['归属部门']] || '';
                        const departments = departmentsStr.split(/[,，]/).map(d => d.trim()).filter(d => d);
                        
                        const planDate = row[headerMap['计划完成时间']];
                        let planDateStr = '';
                        
                        if (planDate) {
                            if (typeof planDate === 'number') {
                                const date = XLSX.SSF.parse_date_code(planDate);
                                planDateStr = `${date.y}-${String(date.m).padStart(2, '0')}-${String(date.d).padStart(2, '0')}`;
                            } else if (typeof planDate === 'string') {
                                if (planDate.includes('/')) {
                                    const parts = planDate.split('/');
                                    if (parts.length === 3) {
                                        planDateStr = `${parts[2]}-${String(parts[0]).padStart(2, '0')}-${String(parts[1]).padStart(2, '0')}`;
                                    }
                                } else {
                                    planDateStr = planDate;
                                }
                            }
                        }

                        const actualDate = row[headerMap['实际完成时间']];
                        let actualDateStr = '';
                        
                        if (actualDate) {
                            if (typeof actualDate === 'number') {
                                const date = XLSX.SSF.parse_date_code(actualDate);
                                actualDateStr = `${date.y}-${String(date.m).padStart(2, '0')}-${String(date.d).padStart(2, '0')}`;
                            } else if (typeof actualDate === 'string') {
                                if (actualDate.includes('/')) {
                                    const parts = actualDate.split('/');
                                    if (parts.length === 3) {
                                        actualDateStr = `${parts[2]}-${String(parts[0]).padStart(2, '0')}-${String(parts[1]).padStart(2, '0')}`;
                                    }
                                } else {
                                    actualDateStr = actualDate;
                                }
                            }
                        }

                        if (departments.length === 0) {
                            errorRows.push(i + 1);
                            continue;
                        }

                        if (!planDateStr) {
                            errorRows.push(i + 1);
                            continue;
                        }

                        newTodos.push({
                            id: Date.now() + i,
                            departments: departments,
                            item: row[headerMap['事项']],
                            assignee: row[headerMap['责任人']] || '',
                            planDate: planDateStr,
                            actualDate: actualDateStr || ''
                        });
                    }

                    if (errorRows.length > 0) {
                        alert(`以下行数据不完整，已跳过: 第 ${errorRows.join(', ')} 行`);
                    }

                    if (newTodos.length === 0) {
                        alert('没有有效数据可导入');
                        return;
                    }

                    let todos = getCurrentTodos();
                    todos = [...todos, ...newTodos];
                    setCurrentTodos(todos);
                    await saveData();
                    renderTable();
                    renderStats();
                    checkWarnings();
                    alert(`成功导入 ${newTodos.length} 条数据`);
                } catch (error) {
                    console.error('导入失败:', error);
                    alert('导入失败，请检查文件格式');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

            Object.keys(allTodos).forEach(projectId => {
                const projectTodos = allTodos[projectId] || [];
                projectTodos.forEach(todo => {
                    allTodosList.push({
                        ...todo,
                        projectId: projectId
                    });
                });
            });

            // 计算总统计
            const totalCount = allTodosList.length;
            const completedCount = allTodosList.filter(t => t.actualDate).length;
            const overallRate = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('completedCount').textContent = completedCount;
            document.getElementById('overallRate').textContent = overallRate + '%';

            // 各部门统计
            const summaryGrid = document.getElementById('summaryGrid');
            const allDepts = ['工程', '成本', '设计', '前期', '营销', '运营'];
            
            summaryGrid.innerHTML = '';
            
            allDepts.forEach(dept => {
                const deptTodos = allTodosList.filter(t => t.departments.includes(dept));
                const deptCompletedCount = deptTodos.filter(t => t.actualDate).length;
                const deptTotalCount = deptTodos.length;
                const deptPercentage = deptTotalCount > 0 ? Math.round((deptCompletedCount / deptTotalCount) * 100) : 0;

                const card = document.createElement('div');
                card.className = 'summary-card';
                card.innerHTML = `
                    <div class="dept-name">${dept}</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${deptPercentage}%"></div>
                    </div>
                    <div class="progress-text">${deptCompletedCount}/${deptTotalCount} (${deptPercentage}%)</div>
                `;
                summaryGrid.appendChild(card);
            });

            // 各项目统计
            const summaryProjects = document.getElementById('summaryProjects');
            summaryProjects.innerHTML = '<h3>📁 各项目完成率</h3>';
            
            projects.forEach(project => {
                const projectTodos = allTodos[project.id] || [];
                const projectCompletedCount = projectTodos.filter(t => t.actualDate).length;
                const projectTotalCount = projectTodos.length;
                const projectPercentage = projectTotalCount > 0 ? Math.round((projectCompletedCount / projectTotalCount) * 100) : 0;

                const statDiv = document.createElement('div');
                statDiv.className = 'project-stat';
                statDiv.innerHTML = `
                    <span class="project-name">${escapeHtml(project.name)}</span>
                    <span class="project-rate">${projectCompletedCount}/${projectTotalCount} (${projectPercentage}%)</span>
                `;
                summaryProjects.appendChild(statDiv);
            });
        }
    </script>
</body>
</html>
